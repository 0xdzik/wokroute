name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

jobs:
  release:
    name: Release
    environment: npm-publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun run test

      - name: Build dashboard
        run: |
          cd dashboard
          bun install --frozen-lockfile
          bun run build

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install semantic-release
        run: |
          npm install -g semantic-release
          npm install -g @semantic-release/changelog
          npm install -g @semantic-release/git
          npm install -g @semantic-release/npm
          npm install -g @semantic-release/github

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # Bumps version, writes CHANGELOG.md, commits, tags, and creates the
      # GitHub release. npm publishing is intentionally NOT done here:
      # @semantic-release/npm requires NPM_TOKEN, but we publish below via
      # NPM Trusted Publishers (OIDC) instead.
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

      # Publishes the just-bumped version via NPM Trusted Publishers: npm
      # exchanges the OIDC token (id-token: write + npm-publish environment)
      # for a short-lived publish grant — no NPM_TOKEN anywhere. Skipped when
      # semantic-release produced no release (no tag on HEAD), e.g. docs or
      # chore-only commits, so a skipped release never attempts a publish.
      - name: Publish to NPM (Trusted Publishers)
        run: |
          if git describe --tags --exact-match HEAD >/dev/null 2>&1; then
            npm publish --provenance
          else
            echo "No release tag on HEAD — skipping npm publish."
          fi
